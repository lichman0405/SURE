name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  bootstrap-validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/validate-bootstrap.mjs
      - run: node scripts/taskctl.mjs validate
      - shell: pwsh
        run: .\scripts\Validate-Bootstrap.ps1

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  shellcheck-secondary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh integrations/claude-code/scripts/*.sh integrations/cursor/scripts/*.sh
