name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  bootstrap-validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate-bootstrap.mjs
      - run: node scripts/taskctl.mjs validate
      - shell: pwsh
        run: .\scripts\Validate-Bootstrap.ps1

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # **The browser tests need a machine that can host a sandboxed Chromium,
      # and Ubuntu 24.04 is not one by default.** It restricts unprivileged user
      # namespaces through AppArmor, and Chromium refuses to start without a
      # usable sandbox — `/usr/bin/chromium` aborts at `ZygoteHostImpl::Init`
      # with *No usable sandbox!*. The product never passes `--no-sandbox`: a
      # browser without it would run the project's JavaScript without the
      # boundary that exists to hold it, so what has to change is the *runner*
      # and not the rule. The knob below is the documented one, and it is
      # deliberately not made tolerant — if a future image drops it this step
      # fails, which is the honest outcome: the browser tests on Linux are then
      # visibly missing rather than quietly skipped.
      - name: Let a sandboxed browser start on Linux
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # `--no-fail-fast` because the first failing target otherwise aborts the
      # rest, and the targets are where the platform-specific tests live: a
      # failure in `sure-core --lib` would hide every integration target after
      # it, on the run whose whole job is to say what this platform does.
      - run: cargo test --workspace --no-fail-fast

  shellcheck-secondary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # `scripts/Build-Release.sh` is invoked as `sh scripts/Build-Release.sh` by
      # all three artifact jobs in `release-dry-run.yml`, so `sh` is the shell it
      # has to be checked against. This job checked it as `bash` until P15-T007,
      # because shellcheck follows the shebang and the shebang said
      # `#!/usr/bin/env bash` — which is why `set -o pipefail`, legal in bash and
      # absent from the dash the script actually ran under, reddened the Linux
      # release job while this lint stayed green. The file's shebang now says
      # `#!/bin/sh`, and the dialect is pinned here as well rather than left to a
      # first line a later edit could change back: the invocation in the workflow
      # is what the script has to survive, and that is not on the file's first
      # line. The one construct the file uses that POSIX `sh` does not have is
      # `local`, which is why the file carries a single `# shellcheck
      # disable=SC3043` at its top; everything else in it is checked as `sh`.
      #
      # The glob below still covers the file, by its shebang, so it is checked
      # twice and by the same dialect. The rest of the line is about the other
      # scripts: they are bash by construction and say so on their own first
      # lines, and nothing about how they are checked changes here.
      #
      # The integration half of the second glob was two package names spelled out
      # until P15-T008, which left `integrations/codex/scripts/sure-hook.sh`
      # unchecked — the one launcher a manifest execs by path rather than through
      # PowerShell, and so the only one whose shell dialect a Unix harness
      # actually depends on. The glob is now the same shape `scripts/preflight.sh`
      # already used, and it covers all three launchers rather than two.
      - run: shellcheck -s sh scripts/Build-Release.sh
      - run: shellcheck scripts/*.sh integrations/*/scripts/*.sh
