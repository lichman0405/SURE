name: release-dry-run

# Manual only, and deliberately so. `ci.yml` runs on every push to `claude/**`
# and on pull requests; this workflow is the one that produces release
# *artifacts*, which is minutes of release build and packaging that no commit
# needs. Adding it to `ci.yml` would put a release build, a package and the
# acceptance corpus's release gate in front of every push, and would make the
# branch's green/red signal depend on a release decision rather than on the
# code. The two workflows answer different questions and stay apart.
#
#   gh workflow run release-dry-run.yml --ref claude/v0.1-autonomous
#
# This workflow has to exist on the default branch for `workflow_dispatch` to
# accept a ref at all; it does (`git ls-tree main -- .github/workflows/` shows
# it), which is why the dispatch above works from the autonomous branch.
on:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      # **The browser tests need a machine that can host a sandboxed Chromium,
      # and Ubuntu 24.04 is not one by default.** This is the same runner state
      # and the same step `ci.yml` documents and applies; the two workflows run
      # the same command on the same matrix, so a difference here is one of the
      # two logs saying something the other does not. Its absence was why
      # `validate (ubuntu-latest)` reddened on `c522699`: `/usr/bin/chromium`
      # aborted at `ZygoteHostImpl::Init` with *No usable sandbox!* and three
      # `browser_driver` tests failed at `crates/sure-core/tests/browser_driver.rs:397`.
      # The product never passes `--no-sandbox`: a browser without it would run
      # the project's JavaScript without the boundary that exists to hold it, so
      # what has to change is the *runner* and not the rule. This step is
      # deliberately not made tolerant — if a future image drops the knob it
      # fails, which is the honest outcome: the Linux browser tests are then
      # visibly missing rather than quietly skipped.
      - name: Let a sandboxed browser start on Linux
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # `--no-fail-fast`, for the reason `ci.yml:50-53` gives and for a second
      # one that is this job's alone. The first failing target otherwise aborts
      # the rest, and the targets are where the platform-specific tests live: a
      # failure in `sure-core --lib` would hide every integration target after
      # it, on the run whose whole job is to say what this platform does. This
      # job is dispatch-only and produces no artifact of its own, so a run that
      # stops at the first red target costs a whole manual dispatch to learn
      # what a single one would have shown. It does not weaken the gate: the job
      # still fails if anything failed, and it fails after reporting everything
      # rather than after reporting the first thing.
      - run: cargo test --workspace --no-fail-fast
      - run: cargo build --workspace --release

  # ===========================================================================
  # The macOS Apple Silicon artifact — P15-T005.
  # ===========================================================================
  #
  # What this job is for, and what it is not for. Its acceptance is
  #
  #   "aarch64 macOS artifact builds/tests and checksum generated in
  #    CI/release environment."
  #
  # which is two claims and not one. **The tests** are `cargo test --workspace
  # --no-fail-fast` in the step below, on this runner, and the same command
  # `ci.yml`'s `rust (macos-latest)` job runs — so the log of this job can be
  # read for that claim directly. They are also what writes
  # `target/tmp/release-gate.json`: `sure_core::release_gate`'s contract makes a
  # `permitted` gate a precondition of packaging, the document is a build
  # artefact under `target/`, and a fresh runner's `target/` does not exist
  # until this job creates it. So the gate being there and `permitted` is
  # evidence that the corpus ran **here** rather than that someone ran it
  # somewhere. **The build** is `scripts/Build-Release.sh`, which packages,
  # checksums and then reads the artifact back: the checksum is recomputed from
  # the bytes on disk and cross-checked with a second tool, the archive's entry
  # list is compared with the set the artifact promises, the extracted binary's
  # first eight bytes are required to be the Mach-O 64-bit magic and the arm64
  # `cputype`, and the extracted binary is **run from the directory it was
  # extracted into**, with the `running from` it reports — which is the path of
  # the running *executable*, `sure_core::doctor`'s `current_exe()` reading, not
  # the directory holding it — compared against the path of the extracted
  # `sure` itself.
  #
  # **Why the architecture is read from the file.** `macos-latest` is believed
  # to be an arm64 image, and a belief is not a measurement: the label's meaning
  # has changed before (`macos-13` is Intel, `macos-14` and later are Apple
  # Silicon) and will change again. Nothing in this job treats the runner's name
  # as evidence about the artifact. The runner's own `uname -m` is printed below
  # so a reader can see whether "and it ran" was possible on the machine at all,
  # and the architecture the job claims is read out of the artifact's own bytes
  # and printed as hex, so the reading can be checked by hand.
  #
  # **What happens if the runner is not arm64.** The build still produces a
  # correct arm64 image — Xcode's clang cross-compiles a thin `aarch64` binary
  # from an Intel host — and the header read still passes. The run step then
  # cannot execute it and **fails**, naming the host, because a build with no
  # test is half of the acceptance and half of it must not read as all of it.
  #
  # **What is not here.** No signing, no notarization, no release, no tag and no
  # upload anywhere but this run's own artifacts. Apple Developer ID credentials
  # are an external blocker (`docs/development/RELEASE_PROCESS.md`, `## Signing`)
  # and `docs/development/RELEASE_PROCESS.md` says "Do not fake signing", so the
  # artifact is unsigned and the script reads its signature off the binary
  # rather than asserting what it is.
  package-macos:
    name: macOS Apple Silicon artifact (aarch64-apple-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          # The target is installed rather than assumed. `rustc --print cfg`
          # knows the triple on any rustup toolchain, but building for it needs
          # its `std`, and a job that discovers that halfway through a release
          # build reports it as a compile error about `core`.
          targets: aarch64-apple-darwin

      # Printed for the log and for a reader. This is not a check and nothing
      # below reads it: it is the context in which the checks below are read.
      - name: What this runner is
        run: |
          set -euo pipefail
          echo "uname -s          $(uname -s)"
          echo "uname -m          $(uname -m)"
          echo "RUNNER_ARCH       ${RUNNER_ARCH:-unset}"
          echo "rustc host        $(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc release     $(rustc -vV | sed -n 's/^release: //p')"
          echo "targets installed $(rustup target list --installed | tr '\n' ' ')"
          # The interpreter that runs `sh scripts/Build-Release.sh` below, named
          # and versioned. It is the one tool this job depends on that was not
          # listed here until P15-T007, and the one whose identity decides what
          # that script is allowed to contain — on this runner `sh` is bash 3.2
          # in POSIX mode, on a Linux runner it is dash. dash cannot report a
          # version in one call, because `--version` is not an option it has, so
          # the version comes from the package that owns it where `sh` will not
          # say, and is `absent` rather than guessed where there is no `dpkg`.
          echo "sh                $(command -v sh || echo absent) -> $(readlink -f "$(command -v sh)" 2>/dev/null || echo absent)"
          sh_version="$(sh -c 'printf "%s" "${BASH_VERSION:-}"')"
          [ -n "$sh_version" ] || sh_version="$(dpkg-query -W -f='${Version}' dash 2>/dev/null)"
          echo "sh version        ${sh_version:-not reported by this sh}"
          echo "tar               $(tar --version | head -n 1)"
          echo "digest tools      sha256sum=$(command -v sha256sum || echo absent)" \
               "shasum=$(command -v shasum || echo absent)" \
               "openssl=$(command -v openssl || echo absent)"
          echo "file              $(command -v file || echo absent)"
          echo "codesign          $(command -v codesign || echo absent)"

      # The "tests" half of builds/tests, and the writer of the release gate.
      # `--no-fail-fast` for the reason `ci.yml` gives: the first failing target
      # otherwise aborts the rest, and the targets are where the
      # platform-specific tests live.
      - name: The workspace's tests, on this runner
        run: cargo test --workspace --no-fail-fast

      - name: Build, package, checksum and check the artifact
        run: sh scripts/Build-Release.sh --phase all --output-dir "$GITHUB_WORKSPACE/target/tmp/release"

      # The script verifies the archive against its own checksum with one tool
      # and cross-checks it with a second. This step asks the platform's own
      # `shasum -c` the same question, from the directory the file was written
      # into, which is how a person who downloaded two files would ask it.
      - name: The checksum, read by the platform's own tool
        working-directory: ${{ github.workspace }}/target/tmp/release
        run: |
          set -euo pipefail
          ls -l
          shasum -a 256 -c sure-*.tar.gz.sha256
          echo
          echo "And the control, because a checksum step that cannot fail is not a"
          echo "check. A copy is modified and the same command is required to refuse"
          echo "it; the artifact itself is not touched."
          control="${RUNNER_TEMP:?RUNNER_TEMP is not set}/checksum-control"
          rm -rf "$control"
          mkdir -p "$control"
          cp sure-*.tar.gz sure-*.tar.gz.sha256 "$control/"
          cd "$control"
          shasum -a 256 -c sure-*.tar.gz.sha256
          printf 'x' >> sure-*.tar.gz
          if shasum -a 256 -c sure-*.tar.gz.sha256; then
            echo "FAILED: the checksum check passed over an archive modified after it was written"
            exit 1
          fi
          echo "the modified copy failed the check, as it must"

      # The evidence first, and unconditionally: a run that failed is the run
      # whose logs someone needs, and an upload that only happens on success is
      # missing exactly when it matters.
      - name: Upload the run's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sure-aarch64-apple-darwin-logs
          path: target/tmp/release/logs/**
          if-no-files-found: warn
          retention-days: 14

      # Then the artifact itself, and only when every check above agreed. This
      # is a workflow artifact and not a release: nothing is tagged, nothing is
      # published and nothing is uploaded anywhere else.
      - name: Upload the artifact and its checksum
        uses: actions/upload-artifact@v4
        with:
          name: sure-aarch64-apple-darwin
          path: |
            target/tmp/release/sure-*.tar.gz
            target/tmp/release/sure-*.tar.gz.sha256
          # An upload that silently uploaded nothing is the shape of every false
          # green this repository exists to prevent.
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # The macOS Intel artifact — P15-T006. **THIS JOB HAS RUN, AND IT BUILT AND
  # RAN THE ARTIFACT.** Run 35514769749, job 106088732392, conclusion success.
  # ===========================================================================
  #
  # This job was the half that could not be finished from a Windows host: it
  # needed the commit on the remote and a dispatch. It got one. Job 106088732392
  # produced `sure-0.0.0-bootstrap-x86_64-apple-darwin.tar.gz`, checked its
  # checksum, extracted it, and ran the extracted `sure doctor` from the
  # extraction directory; that exited 0 reporting
  # `SURE 0.0.0-bootstrap (harness protocol 1), built for macos x86_64`, and the
  # job's verdict line was `the bytes that are checksummed are the bytes that
  # were run`.
  #
  # What that is not: a release. The archive is an `actions/upload-artifact`
  # workflow artifact with `retention-days: 14`, exactly as the arm64 job's is,
  # and the binary is unsigned and unnotarized.
  #
  # **Why `macos-26-intel` and not a guess.** `actions/runner-images`' own
  # table is the authority on what a label means, and it reads:
  #
  #   macOS 26        x64     macos-latest-large, macos-26-intel, macos-26-large
  #   macOS 26 Arm64  arm64   macos-latest, macos-26, macos-26-xlarge
  #   macOS 15        x64     macos-15-large, macos-15-intel
  #   macOS 15 Arm64  arm64   macos-15, macos-15-xlarge
  #
  # Two things follow, and the second is the one that matters here. `macos-latest`
  # — the runner `package-macos` uses — resolves to the **Arm64** row, so this
  # repository's arm64 artifact is built on an arm64 machine and the `-intel`
  # suffix is the x64 spelling. And the x64 image is reachable from a *standard*
  # label (`macos-26-intel`), not only from the `-large` ones: the `-large` and
  # `-xlarge` labels are larger runners, which are billed, and a job that needed
  # one would be a job this project could not promise to run.
  #
  # What that table does **not** say is that this account can obtain the runner.
  # Availability, queueing and billing are properties of the repository and not
  # of the image. **The dispatch was the measurement**, and job 106088732392 is
  # the answer: this account obtained `macos-26-intel`, and `uname -m` printed
  # `x86_64` there, so the run below was a native execution rather than a Rosetta
  # one. The first step below still exists so that its log says which machine ran
  # rather than leaving the label to be believed.
  #
  # **What makes this job evidence rather than a claim.** It is the same script
  # as the arm64 job, with `--target x86_64-apple-darwin`, so the architecture is
  # read from the artifact's own first eight bytes and required to be
  # `cffaedfe07000001` — not inferred from the label, the file name or `uname`.
  # The archive is extracted to a fresh directory and the extracted `sure` is
  # **run from there**, which is the step `P15-T005`'s standard is built on and
  # the step a Windows host cannot reach at all. On an x64 runner that binary is
  # native, so "and it ran" is a reading this job produces and no other machine
  # in this repository can.
  #
  # Note what the runner's identity step is for here specifically: on the arm64
  # image it would print `x86_64` only if Rosetta 2 were present and the shell
  # were running under it. If this job lands on an arm64 host and `uname -m` says
  # `x86_64`, the build is still a correct Intel artifact and the *run* is a
  # Rosetta run — a weaker statement than a native one, and the log says which
  # happened rather than leaving a reader to assume.
  package-macos-intel:
    name: macOS Intel artifact (x86_64-apple-darwin)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-apple-darwin

      # Printed for the log and for a reader. This is not a check and nothing
      # below reads it: it is the context in which the checks below are read.
      # `uname -m` is the line that decides whether the run step below is a
      # native execution or a Rosetta one, so it is printed before anything
      # expensive happens.
      - name: What this runner is
        run: |
          set -euo pipefail
          echo "uname -s          $(uname -s)"
          echo "uname -m          $(uname -m)"
          echo "RUNNER_ARCH       ${RUNNER_ARCH:-unset}"
          echo "RUNNER_OS         ${RUNNER_OS:-unset}"
          echo "rustc host        $(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc release     $(rustc -vV | sed -n 's/^release: //p')"
          echo "targets installed $(rustup target list --installed | tr '\n' ' ')"
          echo "cc                $(command -v cc || echo absent)"
          echo "clang             $(command -v clang || echo absent)"
          # The interpreter that runs `sh scripts/Build-Release.sh` below, named
          # and versioned, the same line the two other artifact jobs carry: on
          # this runner `sh` is bash 3.2 in POSIX mode, on a Linux runner it is
          # dash, and the script has to survive both. The version is asked of `sh`
          # itself and falls back to the package that owns it, because dash has
          # no `--version` to report one with.
          echo "sh                $(command -v sh || echo absent) -> $(readlink -f "$(command -v sh)" 2>/dev/null || echo absent)"
          sh_version="$(sh -c 'printf "%s" "${BASH_VERSION:-}"')"
          [ -n "$sh_version" ] || sh_version="$(dpkg-query -W -f='${Version}' dash 2>/dev/null)"
          echo "sh version        ${sh_version:-not reported by this sh}"
          echo "tar               $(tar --version | head -n 1)"
          echo "digest tools      sha256sum=$(command -v sha256sum || echo absent)" \
               "shasum=$(command -v shasum || echo absent)" \
               "openssl=$(command -v openssl || echo absent)"
          echo "file              $(command -v file || echo absent)"
          echo "codesign          $(command -v codesign || echo absent)"

      # The C compiler line above is the specific thing that decided this job
      # could not be done on the machine that wrote it: a crate's build script
      # compiles C through `cc-rs`, and a Windows host has no `cc` that emits
      # x86_64 Mach-O objects. The crate that log names is `ring v0.17.14`, and
      # it is the crate the Linux job's local build names too; the sentence here
      # used to name `libsqlite3-sys`, which neither log mentions: `cargo` stops
      # at `ring`'s build script and never compiles `libsqlite3-sys`. On a macOS
      # runner that tool is Xcode's clang and is present; the line is printed so
      # the log says so rather than implying it.

      # The "tests" half of builds/tests, and the writer of the release gate.
      - name: The workspace's tests, on this runner
        run: cargo test --workspace --no-fail-fast

      - name: Build, package, checksum and check the artifact
        run: sh scripts/Build-Release.sh --phase all --target x86_64-apple-darwin --output-dir "$GITHUB_WORKSPACE/target/tmp/release"

      - name: The checksum, read by the platform's own tool
        working-directory: ${{ github.workspace }}/target/tmp/release
        run: |
          set -euo pipefail
          ls -l
          shasum -a 256 -c sure-*.tar.gz.sha256
          echo
          echo "And the control, because a checksum step that cannot fail is not a"
          echo "check. A copy is modified and the same command is required to refuse"
          echo "it; the artifact itself is not touched."
          control="${RUNNER_TEMP:?RUNNER_TEMP is not set}/checksum-control"
          rm -rf "$control"
          mkdir -p "$control"
          cp sure-*.tar.gz sure-*.tar.gz.sha256 "$control/"
          cd "$control"
          shasum -a 256 -c sure-*.tar.gz.sha256
          printf 'x' >> sure-*.tar.gz
          if shasum -a 256 -c sure-*.tar.gz.sha256; then
            echo "FAILED: the checksum check passed over an archive modified after it was written"
            exit 1
          fi
          echo "the modified copy failed the check, as it must"

      # The evidence first, and unconditionally: a run that failed is the run
      # whose logs someone needs. This job's first dispatch, 35514769749,
      # succeeded; the upload stays unconditional so that a future failure is
      # readable too.
      - name: Upload the run's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sure-x86_64-apple-darwin-logs
          path: target/tmp/release/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the artifact and its checksum
        uses: actions/upload-artifact@v4
        with:
          name: sure-x86_64-apple-darwin
          path: |
            target/tmp/release/sure-*.tar.gz
            target/tmp/release/sure-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # The Linux x64 artifact — P15-T007. **THIS JOB HAS RUN TWICE, AND THE SECOND
  # RUN BUILT, CHECKSUMMED AND RAN THE ARTIFACT.** Run `35526723850`, attempt 1,
  # on commit `f727d5f`: all six of that run's jobs are green, and this one
  # produced `sure-0.0.0-bootstrap-x86_64-unknown-linux-gnu.tar.gz` — 4599814
  # bytes, sha256
  # `44cd8357478cd2dbafaead10d71a4e56ff10ec86620cb9c8c26650e491c9bb2a` — in 4
  # entries, exactly the promised set. Its `.sha256` was 119 bytes (expected 119),
  # 1 LF, 0 CR; the archive re-read from disk matched it; the extracted `sure` ran
  # from the directory it was extracted into, exited 0 and reported
  # `SURE 0.0.0-bootstrap (harness protocol 1), built for linux x86_64, C library
  # gnu`; and the verdict line was `the bytes that are checksummed are the bytes
  # that were run`. The extracted binary's first twenty bytes were
  # `7f454c4602010100000000000000000003003e00`, and the *Signature* step reported
  # `not read` — an ELF carries no signature field and no step of this build
  # applies one, so that is a measurement that did not happen and not a pass.
  #
  # **What the artifact therefore asks of the machine it runs on: glibc 2.39 or
  # newer.** The *"What this archive asks of its glibc, read off the binary"* step
  # below read `GLIBC_2.30`, `GLIBC_2.32`, `GLIBC_2.33`, `GLIBC_2.34` and
  # `GLIBC_2.39` off the packaged `sure`, and the highest of them is the oldest
  # glibc that can run it. That is the runner's own libc rather than a choice:
  # the identity step printed `Ubuntu 24.04.5 LTS` and `ldd (Ubuntu GLIBC
  # 2.39-0ubuntu8.8) 2.39`. So this artifact does not run on Ubuntu 22.04 (glibc
  # 2.35) or Debian 12 (glibc 2.36), and lowering the floor means building inside
  # an older container — a follow-up this repository owes and has not done.
  #
  # **The run before it failed, and that record stays.** Run `35524124026`,
  # attempt 1, on commit `70ef6dd`, is the other run that has reached this job.
  # Five of that run's six jobs are green; this one is the failure, and it failed
  # in the step below named *"Build, package, checksum and check the artifact"*,
  # 9 ms after that step started, before the release gate was read and before
  # anything was staged, built or written:
  #
  #   scripts/Build-Release.sh: 530: set: Illegal option -o pipefail
  #   ##[error]Process completed with exit code 2.
  #
  # Exit 2. The step after it, *"What this archive asks of its glibc, read off the
  # binary"*, the checksum re-read step and *"Upload the artifact and its
  # checksum"* were all `skipped` on that run: no archive existed anywhere until
  # the run above produced one. The defect was not this task's — both the `set`
  # line and the shebang, as `70ef6dd` carried them, are `c522699`'s (verified by
  # `git blame` at that commit), and they had been correct on every machine that
  # had run the file before, because no earlier target ran this script where `sh`
  # is not bash.
  #
  # **What that run did establish, and it stays.** In this same job, on this same
  # runner, the step *"The workspace's tests, on this runner"* concluded
  # `success`: 81 `test result:` lines, **2648 passed, 0 failed, 12 ignored** —
  # the same counts the green run's tests step reports. The tests half of the
  # acceptance sentence below was earned on the runner the artifact half is meant
  # to run on. What failed was the script's first executed line — and the same log
  # shows the step's own `shell: /usr/bin/bash -e {0}`, which is the measurement
  # behind the comment at the invocation below.
  # ===========================================================================
  #
  # Its acceptance is
  #
  #   "Linux x64 Rust core/CLI package builds/tests and checksum generated."
  #
  # which is the same two claims the two macOS jobs answer, on a third machine:
  # **the tests** are `cargo test --workspace --no-fail-fast` below, the same
  # command `ci.yml`'s `rust (ubuntu-latest)` job runs and the writer of
  # `target/tmp/release-gate.json` that the package step requires to say
  # `permitted`; **the build** is `scripts/Build-Release.sh --phase all
  # --target x86_64-unknown-linux-gnu`, the same script the two macOS jobs run,
  # which packages, checksums and then reads the artifact back.
  #
  # **What the artifact is, and what is still not measured.** Everything below is
  # written to be run and has been exercised on a Windows host only up to the
  # point that host can reach — the architecture read over real ELF bytes, the
  # package, the `.sha256` and the extraction — with the mode check, the signature
  # step, the run of the extracted binary and the verdict line unreached there;
  # the first Linux run stopped before the first of those steps, for the reason
  # recorded above; and the second one reached all of them. So both halves of the
  # acceptance sentence above are now earned for Linux, by the run recorded at the
  # top of this header. What is *not* measured: whether a rebuild would produce the
  # same archive bytes (it would not — a gzip stream records a modification time in
  # its header and a tar records one per entry, so this one follows from the format;
  # only one Linux build has been made), whether any distribution with an older
  # glibc can run the binary (it cannot — see the floor above), and where this
  # artifact sits in a distribution channel (nowhere: it is an
  # `actions/upload-artifact` artifact with `retention-days: 14`, and nothing is
  # tagged or released).
  #
  # **Why the architecture cannot come from the label.** `ubuntu-latest` being
  # x86_64 is a belief about a label, and this repository does not read beliefs
  # as evidence about bytes. The ELF's machine is `e_machine`, two bytes at
  # offset 18, and it is *not* in the first eight bytes: those are
  # `7f454c4602010100` for an x86_64 image and for an aarch64 one alike, so a
  # check built by analogy with the macOS eight-byte read would accept an arm64
  # binary under an x86_64 name. The script reads twenty bytes, compares the
  # four discriminating fields (magic, `EI_CLASS`, `EI_DATA`, `e_machine`) and
  # prints them as hex, so the reading can be checked by hand.
  #
  # **Why the AppArmor step is here.** The same reason it is in `validate` and
  # in `ci.yml`: Ubuntu 24.04 restricts unprivileged user namespaces, and a
  # sandboxed Chromium cannot start without the knob. The product never passes
  # `--no-sandbox`, so the runner is what changes. It is deliberately not made
  # tolerant: if a future image drops the knob, this job fails loudly rather
  # than running the browser tests somewhere they cannot mean anything.
  package-linux:
    name: Linux x64 artifact (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          # The target is installed rather than assumed, for the reason the
          # arm64 job gives: building for a triple needs its `std`, and a job
          # that discovers that halfway through a release build reports it as a
          # compile error about `core`.
          targets: x86_64-unknown-linux-gnu

      # Printed for the log and for a reader. This is not a check and nothing
      # below reads it: it is the context in which the checks below are read,
      # and `uname -m` is the line that says whether the run step below was a
      # native execution or something else.
      #
      # The last three lines are the other half of a sentence the archive's own
      # `RELEASE.txt` carries: an ELF built here links the glibc of *this*
      # image, so the distribution the archive needs is set here and nowhere
      # else. Printing `ldd --version` and the image's `PRETTY_NAME` puts the
      # answer for this run in this log rather than in a guess, and the
      # `objdump -p` line is the tool a reader would use on the artifact to
      # read the same requirement out of the binary itself.
      - name: What this runner is
        run: |
          set -euo pipefail
          echo "uname -s          $(uname -s)"
          echo "uname -m          $(uname -m)"
          echo "RUNNER_ARCH       ${RUNNER_ARCH:-unset}"
          echo "RUNNER_OS         ${RUNNER_OS:-unset}"
          echo "rustc host        $(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc release     $(rustc -vV | sed -n 's/^release: //p')"
          echo "targets installed $(rustup target list --installed | tr '\n' ' ')"
          echo "cc                $(command -v cc || echo absent)"
          # The interpreter that runs `sh scripts/Build-Release.sh` below, named
          # and versioned next to `cc` and `objdump`. **Run 35524124026 could not
          # be read without it**: its failing step printed
          # `scripts/Build-Release.sh: 530: set: Illegal option -o pipefail` and
          # nothing that said which `sh` had refused the option, so the runner's
          # shell had to be inferred from the shape of an error message — which is
          # the kind of answer this repository does not accept when a reading is
          # available. dash cannot report a version in one call, so the version
          # comes from the package that owns it when `sh` will not say it. Run
          # `35526723850` is the same reading taken with the lines in place: it
          # printed `/usr/bin/sh -> /usr/bin/dash` and `sh version 0.5.12-6ubuntu5`,
          # so that run's shell is named in its own log instead of inferred.
          echo "sh                $(command -v sh || echo absent) -> $(readlink -f "$(command -v sh)" 2>/dev/null || echo absent)"
          sh_version="$(sh -c 'printf "%s" "${BASH_VERSION:-}"')"
          [ -n "$sh_version" ] || sh_version="$(dpkg-query -W -f='${Version}' dash 2>/dev/null)"
          echo "sh version        ${sh_version:-not reported by this sh}"
          echo "tar               $(tar --version | head -n 1)"
          echo "digest tools      sha256sum=$(command -v sha256sum || echo absent)" \
               "shasum=$(command -v shasum || echo absent)" \
               "openssl=$(command -v openssl || echo absent)"
          echo "file              $(command -v file || echo absent)"
          echo "objdump           $(command -v objdump || echo absent)"
          echo
          echo "/etc/os-release:"
          sed -n 's/^/  /p' /etc/os-release
          echo "ldd --version:"
          ldd --version | sed -n 's/^/  /p'

      - name: Let a sandboxed browser start on Linux
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The "tests" half of builds/tests, and the writer of the release gate.
      - name: The workspace's tests, on this runner
        run: cargo test --workspace --no-fail-fast

      # **This step's shell is bash and the script it runs is not.** `run:` steps
      # execute under bash — the run's own log prints `shell: /usr/bin/bash -e {0}`
      # for this step — and the *identity* step above, four steps earlier in this
      # same job on this same runner, contains a `set -euo pipefail` of its own
      # and concluded `success`. So `pipefail` is legal in the step and was
      # refused by the thing the step handed the work to: `sh` on this runner is
      # dash, and this invocation is the only place in the job where anything
      # leaves bash. The mechanism is therefore measured in one log rather than
      # argued from an error message — same runner, same job, bash step green on
      # the option and `sh` script red on it — and it is why no `shell:` override
      # belongs here: the step was not what was wrong. What was wrong was a
      # script claiming POSIX in one comment and using a bash extension in the
      # next line, which is fixed in the script and checked as `sh` by
      # `ci.yml`'s lint job. **The fix is measured, not argued:** run
      # `35526723850` ran this same invocation under this same `/usr/bin/sh` and
      # the script went on to build, package, check and run the artifact.
      - name: Build, package, checksum and check the artifact
        run: sh scripts/Build-Release.sh --phase all --target x86_64-unknown-linux-gnu --output-dir "$GITHUB_WORKSPACE/target/tmp/release"

      # The one thing about this archive that no sentence in this repository can
      # supply and that a Linux reader needs: which glibc it asks for. The
      # archive's own `RELEASE.txt` names the mechanism and points at
      # `objdump -p`; this step takes the same reading, out of the archive's own
      # bytes and with no tool but `grep`, so the number is in this log beside
      # the image that produced it instead of being left to a reader's guess.
      #
      # It is a reading and not a check: nothing here fails the job, because a
      # requirement printed to a log is evidence someone can check, while a
      # threshold asserted here would be a rule this repository has not decided
      # anything must satisfy. `package-linux` needs no such rule — the artifact
      # is either correct for its target or the step above already said so.
      #
      # **The first run to reach this step printed the answer, and it is a real
      # restriction.** Run `35526723850` read `GLIBC_2.30`, `GLIBC_2.32`,
      # `GLIBC_2.33`, `GLIBC_2.34` and `GLIBC_2.39` off the packaged binary, so
      # this artifact requires glibc 2.39 or newer and will not run on Ubuntu
      # 22.04 (glibc 2.35) or Debian 12 (glibc 2.36). That number is the runner
      # image's own libc, which is why the identity step above prints it too, and
      # lowering the floor means building inside an older container — a follow-up
      # this repository owes and has not done. It stays a reading rather than a
      # threshold, for the reason above.
      - name: What this archive asks of its glibc, read off the binary
        working-directory: ${{ github.workspace }}/target/tmp/release
        run: |
          set -euo pipefail
          archive=$(ls sure-*.tar.gz)
          name=${archive%.tar.gz}
          extract="$RUNNER_TEMP/glibc-reading"
          rm -rf "$extract"
          mkdir -p "$extract"
          tar -xzf "$archive" -O "$name/sure" > "$extract/sure"
          echo "read from     $archive -> $name/sure"
          versions=$(grep -a -o 'GLIBC_[0-9.]*' "$extract/sure" | sort -u -V || true)
          echo
          if [ -n "$versions" ]; then
            echo "GLIBC symbol versions this binary requires, highest last:"
            printf '%s\n' "$versions" | tail -n 5 | sed 's/^/  /'
            echo
            echo "The highest of these is the oldest glibc that can run this binary."
          else
            echo "No GLIBC_ version strings appear in the bytes of this binary, which"
            echo "would mean it does not link glibc dynamically — the opposite of what"
            echo "the archive's own RELEASE.txt says, and worth looking at."
          fi

      # The script verifies the archive against its own checksum with one tool
      # and cross-checks it with a second. This step asks the platform's own
      # `sha256sum -c` the same question, from the directory the file was
      # written into, which is how a person who downloaded two files would ask
      # it — and it is the tool a Linux reader would reach for, where the two
      # macOS jobs ask `shasum -a 256 -c`.
      - name: The checksum, read by the platform's own tool
        working-directory: ${{ github.workspace }}/target/tmp/release
        run: |
          set -euo pipefail
          ls -l
          sha256sum -c sure-*.tar.gz.sha256
          echo
          echo "And the control, because a checksum step that cannot fail is not a"
          echo "check. A copy is modified and the same command is required to refuse"
          echo "it; the artifact itself is not touched."
          control="${RUNNER_TEMP:?RUNNER_TEMP is not set}/checksum-control"
          rm -rf "$control"
          mkdir -p "$control"
          cp sure-*.tar.gz sure-*.tar.gz.sha256 "$control/"
          cd "$control"
          sha256sum -c sure-*.tar.gz.sha256
          printf 'x' >> sure-*.tar.gz
          if sha256sum -c sure-*.tar.gz.sha256; then
            echo "FAILED: the checksum check passed over an archive modified after it was written"
            exit 1
          fi
          echo "the modified copy failed the check, as it must"

      # The evidence first, and unconditionally: a run that failed is the run
      # whose logs someone needs, and an upload that only happens on success is
      # missing exactly when it matters. The logs directory is written before
      # the first check runs, so a run that fails early still uploads what it
      # got to.
      - name: Upload the run's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sure-x86_64-unknown-linux-gnu-logs
          path: target/tmp/release/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the artifact and its checksum
        uses: actions/upload-artifact@v4
        with:
          name: sure-x86_64-unknown-linux-gnu
          path: |
            target/tmp/release/sure-*.tar.gz
            target/tmp/release/sure-*.tar.gz.sha256
          # An upload that silently uploaded nothing is the shape of every false
          # green this repository exists to prevent.
          if-no-files-found: error
          retention-days: 14
