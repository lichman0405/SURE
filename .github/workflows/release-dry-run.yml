name: release-dry-run

# Manual only, and deliberately so. `ci.yml` runs on every push to `claude/**`
# and on pull requests; this workflow is the one that produces release
# *artifacts*, which is minutes of release build and packaging that no commit
# needs. Adding it to `ci.yml` would put a release build, a package and the
# acceptance corpus's release gate in front of every push, and would make the
# branch's green/red signal depend on a release decision rather than on the
# code. The two workflows answer different questions and stay apart.
#
#   gh workflow run release-dry-run.yml --ref claude/v0.1-autonomous
#
# This workflow has to exist on the default branch for `workflow_dispatch` to
# accept a ref at all; it does (`git ls-tree main -- .github/workflows/` shows
# it), which is why the dispatch above works from the autonomous branch.
on:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo test --workspace
      - run: cargo build --workspace --release

  # ===========================================================================
  # The macOS Apple Silicon artifact — P15-T005.
  # ===========================================================================
  #
  # What this job is for, and what it is not for. Its acceptance is
  #
  #   "aarch64 macOS artifact builds/tests and checksum generated in
  #    CI/release environment."
  #
  # which is two claims and not one. **The tests** are `cargo test --workspace
  # --no-fail-fast` in the step below, on this runner, and the same command
  # `ci.yml`'s `rust (macos-latest)` job runs — so the log of this job can be
  # read for that claim directly. They are also what writes
  # `target/tmp/release-gate.json`: `sure_core::release_gate`'s contract makes a
  # `permitted` gate a precondition of packaging, the document is a build
  # artefact under `target/`, and a fresh runner's `target/` does not exist
  # until this job creates it. So the gate being there and `permitted` is
  # evidence that the corpus ran **here** rather than that someone ran it
  # somewhere. **The build** is `scripts/Build-Release.sh`, which packages,
  # checksums and then reads the artifact back: the checksum is recomputed from
  # the bytes on disk and cross-checked with a second tool, the archive's entry
  # list is compared with the set the artifact promises, the extracted binary's
  # first eight bytes are required to be the Mach-O 64-bit magic and the arm64
  # `cputype`, and the extracted binary is **run from the directory it was
  # extracted into**, with the `running from` it reports compared against that
  # directory.
  #
  # **Why the architecture is read from the file.** `macos-latest` is believed
  # to be an arm64 image, and a belief is not a measurement: the label's meaning
  # has changed before (`macos-13` is Intel, `macos-14` and later are Apple
  # Silicon) and will change again. Nothing in this job treats the runner's name
  # as evidence about the artifact. The runner's own `uname -m` is printed below
  # so a reader can see whether "and it ran" was possible on the machine at all,
  # and the architecture the job claims is read out of the artifact's own bytes
  # and printed as hex, so the reading can be checked by hand.
  #
  # **What happens if the runner is not arm64.** The build still produces a
  # correct arm64 image — Xcode's clang cross-compiles a thin `aarch64` binary
  # from an Intel host — and the header read still passes. The run step then
  # cannot execute it and **fails**, naming the host, because a build with no
  # test is half of the acceptance and half of it must not read as all of it.
  #
  # **What is not here.** No signing, no notarization, no release, no tag and no
  # upload anywhere but this run's own artifacts. Apple Developer ID credentials
  # are an external blocker (`docs/development/RELEASE_PROCESS.md`, `## Signing`)
  # and `docs/development/RELEASE_PROCESS.md` says "Do not fake signing", so the
  # artifact is unsigned and the script reads its signature off the binary
  # rather than asserting what it is.
  package-macos:
    name: macOS Apple Silicon artifact (aarch64-apple-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          # The target is installed rather than assumed. `rustc --print cfg`
          # knows the triple on any rustup toolchain, but building for it needs
          # its `std`, and a job that discovers that halfway through a release
          # build reports it as a compile error about `core`.
          targets: aarch64-apple-darwin

      # Printed for the log and for a reader. This is not a check and nothing
      # below reads it: it is the context in which the checks below are read.
      - name: What this runner is
        run: |
          set -euo pipefail
          echo "uname -s          $(uname -s)"
          echo "uname -m          $(uname -m)"
          echo "RUNNER_ARCH       ${RUNNER_ARCH:-unset}"
          echo "rustc host        $(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc release     $(rustc -vV | sed -n 's/^release: //p')"
          echo "targets installed $(rustup target list --installed | tr '\n' ' ')"
          echo "tar               $(tar --version | head -n 1)"
          echo "digest tools      sha256sum=$(command -v sha256sum || echo absent)" \
               "shasum=$(command -v shasum || echo absent)" \
               "openssl=$(command -v openssl || echo absent)"
          echo "file              $(command -v file || echo absent)"
          echo "codesign          $(command -v codesign || echo absent)"

      # The "tests" half of builds/tests, and the writer of the release gate.
      # `--no-fail-fast` for the reason `ci.yml` gives: the first failing target
      # otherwise aborts the rest, and the targets are where the
      # platform-specific tests live.
      - name: The workspace's tests, on this runner
        run: cargo test --workspace --no-fail-fast

      - name: Build, package, checksum and check the artifact
        run: sh scripts/Build-Release.sh --phase all --output-dir "$GITHUB_WORKSPACE/target/tmp/release"

      # The script verifies the archive against its own checksum with one tool
      # and cross-checks it with a second. This step asks the platform's own
      # `shasum -c` the same question, from the directory the file was written
      # into, which is how a person who downloaded two files would ask it.
      - name: The checksum, read by the platform's own tool
        working-directory: ${{ github.workspace }}/target/tmp/release
        run: |
          set -euo pipefail
          ls -l
          shasum -a 256 -c sure-*.tar.gz.sha256
          echo
          echo "And the control, because a checksum step that cannot fail is not a"
          echo "check. A copy is modified and the same command is required to refuse"
          echo "it; the artifact itself is not touched."
          control="${RUNNER_TEMP:?RUNNER_TEMP is not set}/checksum-control"
          rm -rf "$control"
          mkdir -p "$control"
          cp sure-*.tar.gz sure-*.tar.gz.sha256 "$control/"
          cd "$control"
          shasum -a 256 -c sure-*.tar.gz.sha256
          printf 'x' >> sure-*.tar.gz
          if shasum -a 256 -c sure-*.tar.gz.sha256; then
            echo "FAILED: the checksum check passed over an archive modified after it was written"
            exit 1
          fi
          echo "the modified copy failed the check, as it must"

      # The evidence first, and unconditionally: a run that failed is the run
      # whose logs someone needs, and an upload that only happens on success is
      # missing exactly when it matters.
      - name: Upload the run's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sure-aarch64-apple-darwin-logs
          path: target/tmp/release/logs/**
          if-no-files-found: warn
          retention-days: 14

      # Then the artifact itself, and only when every check above agreed. This
      # is a workflow artifact and not a release: nothing is tagged, nothing is
      # published and nothing is uploaded anywhere else.
      - name: Upload the artifact and its checksum
        uses: actions/upload-artifact@v4
        with:
          name: sure-aarch64-apple-darwin
          path: |
            target/tmp/release/sure-*.tar.gz
            target/tmp/release/sure-*.tar.gz.sha256
          # An upload that silently uploaded nothing is the shape of every false
          # green this repository exists to prevent.
          if-no-files-found: error
          retention-days: 14
