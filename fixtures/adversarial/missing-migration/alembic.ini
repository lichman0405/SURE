# The file that says this project manages its database with Alembic.
#
# This is the only Alembic file the project has. The revisions Alembic would
# write into `alembic/versions/` were never generated, and `env.py` beside this
# file was never written either: the migration half of the project was
# abandoned one file in.
#
# See README.md.

[alembic]
script_location = alembic

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
