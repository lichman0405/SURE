PackageIdentifier: lichman0405.SURE
PackageVersion: <version>
PackageLocale: en-US
Publisher: lichman0405
PublisherUrl: https://github.com/lichman0405
PackageName: SURE
PackageUrl: https://github.com/lichman0405/SURE
License: Apache-2.0
LicenseUrl: https://github.com/lichman0405/SURE/blob/main/LICENSE
ShortDescription: Checks a project's claims about itself against what is on disk, and says "cannot confirm" when the evidence is not there.
Description: |
  SURE (Software Understanding & Reality Evaluation) is a project truth-checking
  layer for AI-built software. It reads a repository, checks the claims made
  about it against evidence on disk, and reports a verdict — including, when the
  evidence is not there, the verdict "cannot confirm". AI says it's done. Be SURE.

  This package installs the command-line program and nothing else. It does not
  install a service, does not run anything in the background, needs no
  administrator, and does not install the Claude Code, Codex, Copilot or Cursor
  integrations. It is an unsigned build, so Windows SmartScreen will warn the
  first time it runs.

  SURE's own data is not part of this package. Its evidence store lives under
  %LOCALAPPDATA%\SURE, beside any per-user install made by
  scripts\Install-Sure.ps1, and uninstalling this package does not remove it.
  See docs/development/INSTALL_WINGET.md in the repository for what an uninstall
  removes, what it leaves, and how to delete what is left.
Moniker: sure
Tags:
  - cli
  - developer-tools
  - verification
  - ai
