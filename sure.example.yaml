privacy:
  mode: local_first
  full_recording: false
  telemetry: false

protection:
  mode: standard

execution:
  mode: inspect_only
  allow_dependency_install: false
  allow_network: false

analysis:
  provider: disabled
  # Both are meaningless while the provider is `disabled`, and SURE refuses the
  # combination rather than accept a setting that could not take effect. Set
  # them together with a provider that uses a model.
  #
  # The endpoint must be an http(s) URL, and must NOT carry a password. A
  # project file is not a safe place for a credential — SURE refuses one here
  # and never prints it. Keep credentials in your user-level configuration or an
  # environment variable.
  endpoint: null
  model: null

project_intent:
  # An explicit goal, written by a person. SURE treats this as documentation:
  # it never becomes a requirement the project is graded against, because a file
  # anyone can edit cannot state what the user asked for.
  goal: null
  # A specification document inside this project, relative to the project root.
  # A path that leaves the project is refused.
  spec_path: null

checks:
  existing_tests: true
  start_local_services: auto
  browser_probe: auto

report:
  format: human
