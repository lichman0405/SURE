privacy:
  mode: local_first
  full_recording: false
  telemetry: false

protection:
  mode: standard

execution:
  mode: inspect_only
  allow_dependency_install: false
  allow_network: false

analysis:
  provider: disabled
  # All three are meaningless while the provider is `disabled`, and SURE refuses
  # the combination rather than accept a setting that could not take effect. Set
  # them together with a provider that uses them.
  #
  # The endpoint must be an http(s) URL, and must NOT carry a password. A
  # project file is not a safe place for a credential — SURE refuses one here
  # and never prints it.
  #
  # For `provider: openai_compatible`, also set the API key in the environment
  # variable `SURE_OPENAI_API_KEY`. SURE sends the request directly to the
  # endpoint you configure; it does not proxy the call through any SURE service.
  endpoint: null
  model: null
  # For `provider: local_command`, the command to run. The first element is the
  # program and the rest are arguments, one element per argument. SURE appends
  # the prompt as the final argument. It is not used by the other providers.
  command: null

project_intent:
  # An explicit goal, written by a person. SURE treats this as documentation:
  # it never becomes a requirement the project is graded against, because a file
  # anyone can edit cannot state what the user asked for.
  goal: null
  # A specification document inside this project, relative to the project root.
  # A path that leaves the project is refused.
  spec_path: null

checks:
  existing_tests: true
  start_local_services: auto
  browser_probe: auto
  # Local services this project declares. Empty by default, and the block below
  # is the shape rather than a setting: uncomment it and edit it to declare one.
  #
  # A declaration names a launcher SURE knows instead of a command line. SURE
  # runs this machine's `node` with the entry file as its **one** argument, in
  # `directory` (relative to the project root; leave it out for the root
  # itself), and the `readiness` path must answer once the service is up. `page`
  # is a path to open in a browser afterwards, and a declaration that names none
  # gets no browser check.
  #
  # A declaration only ever *proposes* checks. Whether one may run is decided by
  # the user's own settings file outside this project — `execution.mode`, the
  # `run_project_code` permission a service check needs, and the
  # `connect_service` permission a browser check needs — and a project's own
  # file cannot grant any of them.
  # services:
  #   - name: api
  #     directory: packages/api
  #     launcher:
  #       kind: node_entry
  #       entry: server.js
  #     port: 4310
  #     readiness: /health
  #     page: /

report:
  format: human

redaction:
  literals: []
  patterns: []
